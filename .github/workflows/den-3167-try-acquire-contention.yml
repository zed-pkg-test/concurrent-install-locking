name: DEN-3167 try-acquire contention canary

on:
  pull_request:
    paths:
      - '.github/workflows/den-3167-try-acquire-contention.yml'
      - 'probes/try-acquire-contention/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/den-3167-try-acquire-contention.yml'
      - 'probes/try-acquire-contention/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-3167-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZED_LOCK_COMMIT: d65871b93fde8e7c9d5f5410bfa8f3543e42819a
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  immediate-contention:
    name: ${{ matrix.os }} immediate contention
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - name: Check out independent probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: canary
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact zed-lock candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-lock
          ref: ${{ env.ZED_LOCK_COMMIT }}
          path: zed-lock
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install stable Rust validation toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Verify immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ZED_LOCK_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C zed-lock rev-parse HEAD)" = "$ZED_LOCK_COMMIT"
          grep -Fq 'pub fn try_acquire' zed-lock/src/lib.rs
          grep -Fq 'ErrorKind::WouldBlock' zed-lock/src/lib.rs

      - name: Validate standalone library baseline
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path zed-lock/Cargo.toml -- --check
          if git -C zed-lock ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            cargo test --locked --manifest-path zed-lock/Cargo.toml
          else
            cargo test --manifest-path zed-lock/Cargo.toml
            rm -f zed-lock/Cargo.lock
          fi

      - name: Run independent immediate-contention probe
        shell: bash
        run: |
          set -euo pipefail
          cargo test \
            --manifest-path canary/probes/try-acquire-contention/Cargo.toml \
            --test try_acquire \
            immediate_contention_is_none_then_retry_acquires \
            -- --exact --nocapture

      - name: Strict Clippy for the independent probe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo clippy \
            --manifest-path canary/probes/try-acquire-contention/Cargo.toml \
            --tests -- -D warnings

      - name: Prove source checkouts remained clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! git -C zed-lock ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            rm -f zed-lock/Cargo.lock
          fi
          if ! git -C canary ls-files --error-unmatch probes/try-acquire-contention/Cargo.lock >/dev/null 2>&1; then
            rm -f canary/probes/try-acquire-contention/Cargo.lock
          fi
          for repository in canary zed-lock; do
            status="$(git -C "$repository" status --porcelain=v1 --untracked-files=all)"
            if [[ -n "$status" ]]; then
              printf 'dirty %s checkout:\n%s\n' "$repository" "$status" >&2
            fi
            test -z "$status"
          done

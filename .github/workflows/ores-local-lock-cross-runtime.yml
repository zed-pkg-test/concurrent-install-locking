name: ORES local-lock cross-runtime interoperability

on:
  pull_request:
    paths:
      - "canaries/ores-local-lock-cross-runtime/**"
      - ".github/workflows/ores-local-lock-cross-runtime.yml"
  push:
    branches: [main]
    paths:
      - "canaries/ores-local-lock-cross-runtime/**"
      - ".github/workflows/ores-local-lock-cross-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-local-lock-cross-runtime-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORES_LOCKS_SHA: aefe7b3034378e601539212c9828ce417b097e97

jobs:
  interop:
    name: ${{ matrix.os }} / Rust-Go-TypeScript rotation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out independent zed-pkg test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Check out exact ORES locks source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-locks-and-leases
          ref: ${{ env.ORES_LOCKS_SHA }}
          path: upstream/ores-locks-and-leases
          persist-credentials: false
          show-progress: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.85.1"
          components: rustfmt,clippy

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version: "1.22"
          cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build exact production TypeScript implementation
        working-directory: upstream/ores-locks-and-leases/src/ts
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build Rust helper
        run: |
          cargo generate-lockfile --manifest-path canaries/ores-local-lock-cross-runtime/rust/Cargo.toml
          cargo fmt --manifest-path canaries/ores-local-lock-cross-runtime/rust/Cargo.toml -- --check
          cargo clippy --locked --manifest-path canaries/ores-local-lock-cross-runtime/rust/Cargo.toml -- -D warnings
          cargo build --locked --manifest-path canaries/ores-local-lock-cross-runtime/rust/Cargo.toml

      - name: Build Go helper
        working-directory: canaries/ores-local-lock-cross-runtime/go
        run: |
          gofmt -w main.go
          git diff --exit-code -- main.go
          go vet ./...
          mkdir -p ../bin
          go build -o ../bin/go-helper .

      - name: Resolve helper paths
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          echo "RUST_HELPER=$GITHUB_WORKSPACE/canaries/ores-local-lock-cross-runtime/rust/target/debug/ores-local-lock-cross-runtime-rust${suffix}" >> "$GITHUB_ENV"
          echo "GO_HELPER=$GITHUB_WORKSPACE/canaries/ores-local-lock-cross-runtime/bin/go-helper${suffix}" >> "$GITHUB_ENV"
          echo "TS_HELPER=$GITHUB_WORKSPACE/canaries/ores-local-lock-cross-runtime/ts/helper.mjs" >> "$GITHUB_ENV"

      - name: Rotate holders and contenders across runtimes
        run: node canaries/ores-local-lock-cross-runtime/run.mjs
